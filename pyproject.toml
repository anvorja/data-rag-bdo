[project]
name = "rag-bocc"
version = "0.1.0"
description = "Corpus y pipeline para un asesor virtual bancario (RAG) con documentación pública del Banco de Occidente"
requires-python = ">=3.12"
dependencies = ["lxml>=5.0"]

[tool.ruff]
line-length = 200
target-version = "py312"
extend-exclude = ["_raw", "rag-bocc"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401", "F841", "F821", "F811"]
